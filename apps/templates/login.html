<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン画面</title>
    <style>
        <!--
        /**
        * レイアウト用ボックスを囲む
        */
        .container {
            width: 960px;       /* サイトの基本となる横幅 */
            margin-right: auto; /* 右側の余白を自動で調整 */
            margin-left: auto;  /* 左側の余白を自動で調整 */
        }

        /* ボックスの構造を分かりやすくするため */
        .layout {
            text-align: center;             /* 水平方向の配置を指定するプロパティ(center:中央揃え) */
            background-color: #dedede;    /* 要素の背景色 */
            padding: 10px;                  /* 要素の内側の余白 */
            border: 1px solid #949494;    /* 枠線 */
            margin-bottom: 10px;            /* 要素の下側のマージン領域 */
        }

        /* 見出し */
        .heading {
            color: #000000;   /* 文字色 */
            Font-size: 30px;    /* 文字サイズ指定 */
            font-weight: bold;  /* フォントの太さ */
        }

        /* 従業員ID */
        .employee_id {
            float: left;        /* 要素の並び left:左寄せ */
            width: 440px;       /* 幅 */
            font-weight: bold;  /* フォントの太さ */
        }

        /* パスワード */
        .password {
            float: right;       /* 要素の並び right:右寄せ */
            width: 440px;       /* 幅 */
            font-weight: bold;  /* フォントの太さ */
        }

        /* エラーメッセージ */
        .errorMessage {
            color:rgb(252, 21, 67); /* フォントの色 */
        }

        /* クリアフィックス */
        .clearfix:after {
            content: "";    /* 要素の直前や直後に内容を挿入するプロパティ */
            display: block; /* 要素の表示形式 */
            clear: both;    /* float による回り込みを解除するプロパティ */
        }

        /* ログインボタン */
        .login_btn {
            background-color: #403f3c;/* ボタン全体の色 */  
            border: none;               /* 枠線 */
            border-radius: 10px;        /* ボックスの角を丸くする */
            color: #fff;              /* 文字色 */
            cursor: pointer;            /* マウスポインターが要素の上にいるときに表示されるマウスカーソルの種類(pointer:指差しの手に) */
            font-weight: bold;          /* フォントの太さ */
            height: 50px;               /* 高さ */
            margin: 20px auto;          /* 要素の外側部分の余白を指定するプロパティ */
            text-align: center;         /* 水平方向の配置を指定するプロパティ(center:中央揃え) */
            width: 50%;                 /* 幅 */
        }

        -->
    </style>
</head>
<body>
    {% block body %}
    <div class="container">
        <form action="/login_auth" method="post">
            <div class="layout clearfix">
                <p class="heading">ログイン画面</p>
                <div class="layout employee_id">従業員ID
                    <input type="text" name="employee_id" />
                </div>
                <div class="layout password">パスワード
                    <input type="password" name="password" />
                </div>
                <div class="clearfix"></div>
                <h4 class="errorMessage">{{ errorMessage }}</h4>
                <h4 class="errorMessage">{{ variable }}</h4>
                <button class="login_btn" type="submit">ログイン</button>
            </div>
        </form>
    </div>
    {% endblock %}
</body>
</html>
